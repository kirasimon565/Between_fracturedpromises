plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

// 1. LOCATE FLUTTER SDK: This ensures the script knows where to look for the engine
def flutterRoot = System.getenv('FLUTTER_ROOT')
if (flutterRoot == null) {
    def localProperties = new Properties()
    def localPropertiesFile = rootProject.file('local.properties')
    if (localPropertiesFile.exists()) {
        localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) }
        flutterRoot = localProperties.getProperty('flutter.sdk')
    }
}

android {
    namespace "com.between.fracturedpromises"
    compileSdk 34

    sourceSets {
        // Pointing to the new Java directory we created
        main.java.srcDirs += 'src/main/java'
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.between.fracturedpromises"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    // 2. FORCE LINKING: This fixes the "package io.flutter does not exist" error
    if (flutterRoot != null) {
        compileOnly fileTree(dir: "$flutterRoot/bin/cache/artifacts/engine/android-arm64-release", include: ['*.jar'])
        compileOnly fileTree(dir: "$flutterRoot/bin/cache/artifacts/engine/android-x64-release", include: ['*.jar'])
        compileOnly fileTree(dir: "$flutterRoot/bin/cache/artifacts/engine/android-x86-release", include: ['*.jar'])
    }

    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
}
