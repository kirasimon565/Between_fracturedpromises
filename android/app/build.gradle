plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

android {
    // Standardizing the namespace for your app
    namespace "com.between.fracturedpromises"
    compileSdk 36

    sourceSets {
        main.java.srcDirs += 'src/main/java'
        main.java.srcDirs += 'src/main/kotlin'
    }

    /**
     * ✅ MANDATORY for AGP 8.0+
     * This fixes the deprecation warning and ensures your app can access 
     * its own package name and version via the BuildConfig class.
     */
    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.between.fracturedpromises"
        // Elevated minSdk to 25 to support modern security/media features
        minSdkVersion 25
        targetSdkVersion 36
        versionCode 1
        versionName "1.0.0"
        
        // Ensure resource linking doesn't fail on lStar
        vectorDrawables.useSupportLibrary = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            // Keep false for initial production testing to make debugging easier
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    // Firebase BoM ensures version consistency across all Firebase services
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth' // Added for Nadia's user profile logic
    
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
}
