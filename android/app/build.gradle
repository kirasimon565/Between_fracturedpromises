plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    // Standardizing the namespace for your app
    namespace "com.between.fracturedpromises"
    compileSdk 36

    sourceSets {
        main.java.srcDirs += 'src/main/java'
        main.java.srcDirs += 'src/main/kotlin'
    }

    /**
     * ✅ MANDATORY for AGP 8.0+
     * This fixes the deprecation warning and ensures your app can access 
     * its own package name and version via the BuildConfig class.
     */
    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.between.fracturedpromises"
        // Elevated minSdk to 25 to support modern security/media features
        minSdkVersion 25
        targetSdkVersion 36
        versionCode 1
        versionName "1.0.0"
        
        // Ensure resource linking doesn't fail on lStar
        vectorDrawables.useSupportLibrary = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        debug {
            // local debug keystore for local/dev builds (optional)
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Use the release keystore decoded by CI workflow: android/app/release.jks
            def keystoreFile = file('release.jks')
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: ""
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: ""
                keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: ""
            } else {
                println("WARNING: release.jks not found. Ensure CI decodes it to android/app/release.jks")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            // Keep false for initial production testing to make debugging easier
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    // No Firebase, no Play Services, no network SDKs: the game is 100% offline.
    // Store billing is reached through platform channels implemented per
    // flavour (Huawei IAP / Amazon IAP / Samsung IAP), so nothing is linked here.
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
}
