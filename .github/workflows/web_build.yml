name: Flutter Web Live Test (1 Hour)

on:
  workflow_dispatch: # Allows you to trigger this manually from the "Actions" tab

jobs:
  web_tunnel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Flutter Web
        run: |
          flutter pub get
          flutter build web --release

      - name: Install Local Server & Tunnel
        run: |
          npm install -g serve
          npm install -g localtunnel

      - name: Launch Tunnel
        run: |
          # Start the server in the background
          serve -s build/web -l 8080 &
          
          echo "------------------------------------------------------------"
          echo "🚀 WEB TEST IS STARTING!"
          echo "The tunnel will stay active for 60 minutes."
          echo "------------------------------------------------------------"
          
          # Start localtunnel and keep it running
          # It will print the URL in the logs
          lt --port 8080 & 
          
          # Keep the action alive for 1 hour
          sleep 3600
