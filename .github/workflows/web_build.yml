name: Stable Web Test Tunnel
run-name: Web Test on ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Minutes to keep live (max 360)'
        required: true
        default: '60'
  push:
    branches:
      - 'setup-between-project-11757872405521559736'

jobs:
  test_web:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/setup-between-project-11757872405521559736'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: setup-between-project-11757872405521559736

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Flutter Web
        run: |
          flutter pub get
          flutter build web --release

      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Start Live Tunnel
        run: |
          echo "------------------------------------------------------------"
          echo "🚀 YOUR LIVE WEB LINK WILL BE GENERATED BELOW"
          echo "------------------------------------------------------------"
          
          cd build/web
          # Start background server
          python3 -m http.server 8080 & 
          
          # Start Cloudflare Tunnel in the background
          # This captures the output and extracts the link automatically
          cloudflared tunnel --url http://localhost:8080 > tunnel.log 2>&1 &
          
          # Wait a few seconds for the tunnel to generate the URL
          sleep 10
          
          # Print the URL clearly in the log
          echo "✅ CLICK THE LINK BELOW TO TEST YOUR APP:"
          grep -o 'https://[-a-z0-9.]*\.trycloudflare.com' tunnel.log | head -n 1
          echo "------------------------------------------------------------"
          
          # Keep the job running for the requested time
          echo "Waiting for ${{ github.event.inputs.duration || 60 }} minutes..."
          sleep $(( ( ${{ github.event.inputs.duration || 60 }} ) * 60 ))
