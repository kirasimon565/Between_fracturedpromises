name: Live Web Test Tunnel
run-name: Web Test on ${{ github.ref_name }} # Shows the branch name in the list

on:
  workflow_dispatch: # Manual trigger

jobs:
  test_web:
    # Only allow this to run on your specific branch
    if: github.ref == 'refs/heads/setup-between-project-11757872405521559736'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Hardcoded Branch
        uses: actions/checkout@v4
        with:
          ref: setup-between-project-11757872405521559736 # Hardcoded branch

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Flutter Web
        run: |
          flutter pub get
          flutter build web --release

      - name: Start Live Tunnel (1 Hour)
        run: |
          echo "------------------------------------------------------------"
          echo "🚀 YOUR LIVE WEB LINK WILL APPEAR BELOW"
          echo "------------------------------------------------------------"
          cd build/web
          # Host the web folder on port 8000
          python3 -m http.server 8000 & 
          
          # Open tunnel via Pinggy for 3600 seconds (1 hour)
          # Note: If it asks for a fingerprint, StrictHostKeyChecking=no handles it
          ssh -o StrictHostKeyChecking=no -p 443 -R0:localhost:8000 a.pinggy.io sleep 3600
