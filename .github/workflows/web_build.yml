name: Live Web Test Tunnel

on:
  workflow_dispatch: # This is the "Manual Trigger"
    inputs:
      duration:
        description: 'Tunnel duration in seconds (3600 = 1 hour)'
        required: true
        default: '3600'

jobs:
  test_web:
    runs-on: ubuntu-latest
    # This ensures the job only runs if you are on your specific setup branch
    if: github.ref == 'refs/heads/setup-between-project-11757872405521559736'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: setup-between-project-11757872405521559736

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Flutter Web
        run: |
          flutter pub get
          flutter build web --release

      - name: Start Live Tunnel
        run: |
          echo "------------------------------------------------------------"
          echo "🚀 YOUR LIVE WEB LINK WILL APPEAR BELOW"
          echo "------------------------------------------------------------"
          cd build/web
          python3 -m http.server 8000 & 
          # Tunneling to Pinggy for the specified duration
          ssh -o StrictHostKeyChecking=no -p 443 -R0:localhost:8000 a.pinggy.io sleep ${{ github.event.inputs.duration }}
