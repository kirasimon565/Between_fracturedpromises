name: Live Web Test Tunnel
run-name: Web Test on ${{ github.ref_name }}

on:
  workflow_dispatch: # Manual trigger
  push:
    branches:
      - 'setup-between-project-11757872405521559736' # Force GitHub to register the file

jobs:
  test_web:
    runs-on: ubuntu-latest
    # This prevents the job from running on EVERY push if you only want manual runs
    # But for the first time, let it run to confirm it works
    steps:
      - name: Checkout Hardcoded Branch
        uses: actions/checkout@v4
        with:
          ref: setup-between-project-11757872405521559736

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Flutter Web
        run: |
          flutter pub get
          flutter build web --release

            - name: Start Live Tunnel (1 Hour)
        run: |
          echo "------------------------------------------------------------"
          echo "🚀 YOUR LIVE WEB LINK WILL APPEAR BELOW"
          echo "------------------------------------------------------------"
          
          cd build/web
          # Start a background server on port 8000
          python3 -m http.server 8000 & 
          
          # Wait 2 seconds for server to start
          sleep 2
          
          # Correct Pinggy SSH command for GitHub Actions:
          # -t: Force pseudo-terminal (helps display the URL)
          # ServerAliveInterval: Keeps the connection from dropping
          # Strictly use 'free.pinggy.io' for the free tier
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -p 443 -R0:localhost:8000 -t free.pinggy.io sleep 3600
