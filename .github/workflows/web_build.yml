name: Live Web Test Tunnel
run-name: Web Test on ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Tunnel duration in seconds (3600 = 1 hour)'
        required: true
        default: '3600'
  push:
    branches:
      - 'setup-between-project-11757872405521559736'

jobs:
  test_web:
    runs-on: ubuntu-latest
    # Hardcoded check to ensure it only runs on your branch
    if: github.ref == 'refs/heads/setup-between-project-11757872405521559736'

    steps:
      - name: Checkout Hardcoded Branch
        uses: actions/checkout@v4
        with:
          ref: setup-between-project-11757872405521559736

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Flutter Web
        run: |
          flutter pub get
          flutter build web --release

      - name: Start Live Tunnel (1 Hour)
        run: |
          echo "------------------------------------------------------------"
          echo "🚀 YOUR LIVE WEB LINK WILL APPEAR IN THE LOG BELOW"
          echo "------------------------------------------------------------"
          
          cd build/web
          # Start a background server to host the files
          python3 -m http.server 8000 & 
          
          # Wait a moment for the server to initialize
          sleep 3
          
          # Force a terminal (-t) and bypass host checks to show the URL
          # Use free.pinggy.io to ensure compatibility with free tier
          ssh -t -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -p 443 -R0:localhost:8000 free.pinggy.io sleep ${{ github.event.inputs.duration || 3600 }}
