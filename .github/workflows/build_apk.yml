name: Build Flutter APK

on:
  push:
    branches: [ setup-between-project-11757872405521559736 ]
  pull_request:
    branches: [ setup-between-project-11757872405521559736 ]
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Verify Flutter installation
        run: |
          flutter --version
          flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Configure local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_HOME" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties
          cat android/local.properties

      - name: Create debug keystore
        run: |
          keytool -genkey -v -keystore android/app/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Clean build
        run: flutter clean

      - name: Check Gradle wrapper
        run: |
          echo "=== Gradle wrapper version ==="
          cd android
          ./gradlew --version
          cd ..

      - name: Build APK (all architectures)
        id: build_apk
        continue-on-error: true
        run: flutter build apk --release --split-per-abi --verbose 2>&1 | tee build_log.txt

      - name: Check build directory structure
        if: always()
        run: |
          echo "=== Checking if build directory exists ==="
          ls -la build/ || echo "build directory not found"
          echo ""
          echo "=== Checking build/app if it exists ==="
          ls -la build/app/ || echo "build/app directory not found"
          echo ""
          echo "=== Full directory tree of build ==="
          find build -type d 2>/dev/null || echo "No build directory found"

      - name: Search for APK files
        if: always()
        run: |
          echo "=== Searching for all APK files ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found anywhere"
          echo ""
          echo "=== Checking standard output directory ==="
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "flutter-apk directory not found"
          echo ""
          echo "=== Checking all output directories ==="
          find build/app/outputs -type d 2>/dev/null || echo "No outputs directory"
          echo ""
          echo "=== Checking for any APK in outputs ==="
          find build/app/outputs -name "*.apk" -type f 2>/dev/null || echo "No APK in outputs"
      
      - name: Check Gradle build logs
        if: always()
        run: |
          echo "=== Checking for Gradle daemon logs ==="
          find ~/.gradle -name "*.log" -type f -exec echo "File: {}" \; -exec tail -100 {} \; 2>/dev/null || echo "No Gradle logs found"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt

      - name: Fail if build failed
        if: steps.build_apk.outcome == 'failure'
        run: exit 1

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
        continue-on-error: true  # x86_64 might not always be built
