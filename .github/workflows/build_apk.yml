name: Production Build

on:
  push:
    branches: [ setup-between-project-11757872405521559736 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ✅ Ensure Android SDK + sdkmanager exist (and licenses are accepted)
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ✅ Install the exact SDK packages your build needs
      - name: Install Android SDK packages
        run: |
          sdkmanager --list | head -n 50
          yes | sdkmanager --licenses

          # API 36 + build tools (adjust build-tools version if your project uses a different one)
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Build Signed APK
        env:
          STORE_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
          ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          cd android

          # Use wrapper (more reliable than system gradle)
          gradle wrapper --gradle-version 8.9 --distribution-type all
          chmod +x gradlew

          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/release.jks \
            -Pandroid.injected.signing.store.password=$STORE_PASS \
            -Pandroid.injected.signing.key.alias=$ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASS

      - name: Organize APKs for Download
        run: |
          mkdir -p build/app/outputs/flutter-apk/
          find android/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} build/app/outputs/flutter-apk/ \;

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Between-Production-APK
          path: build/app/outputs/flutter-apk/*.apk
