name: Production Build

on:
  push:
    branches: [ setup-between-project-11757872405521559736 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      # 🛠️ FIXED: Using the :env modifier ensures keytool gets the FULL password
      - name: Create Permanent Keystore
        env:
          PASS_SECRET: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ALIAS_SECRET: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          keytool -genkeypair -v -keystore android/app/release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "$ALIAS_SECRET" \
            -storepass:env PASS_SECRET \
            -keypass:env PASS_SECRET \
            -dname "CN=Between Dev, O=NoirSim, C=US"

      - name: Build Signed APK
        env:
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
          STORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          cd android
          gradle wrapper --gradle-version 8.9 --distribution-type all
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=release.jks \
            -Pandroid.injected.signing.store.password=$STORE_PASS \
            -Pandroid.injected.signing.key.alias=$ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASS

      - name: Organize APKs
        run: |
          mkdir -p build/app/outputs/flutter-apk/
          find android/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} build/app/outputs/flutter-apk/ \;

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: Between-Production-Package
          path: |
            build/app/outputs/flutter-apk/*.apk
            android/app/release.jks
