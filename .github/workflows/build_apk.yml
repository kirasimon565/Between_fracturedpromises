name: Production Build

on:
  push:
    branches: [ Between ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ✅ Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      # ✅ Decode keystore file from base64 secret (no key.properties used)
      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.jks

      # ✅ Flutter build — pass keystore secrets as env vars so your Gradle can read them from System.getenv()
      - name: Build Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      # ✅ Collect APK
      - name: Organize APKs for Download
        run: |
          mkdir -p build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/*.apk build/app/outputs/flutter-apk/ || true

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Between-Production-APK
          path: build/app/outputs/flutter-apk/*.apk
