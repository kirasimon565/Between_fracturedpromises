name: Build Flutter APK

on:
  push:
    branches: [ setup-between-project-11757872405521559736 ] # Runs automatically when you push code

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Updated to v4

      - name: Set up Java
        uses: actions/setup-java@v4 # Updated to v4
        with:
          distribution: 'zulu'
          java-version: '17' # Required for Gradle 8.1.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # Speeds up future builds

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        # We use --split-per-abi to keep the file size small for your phone
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4 # Updated to v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release-arm64-v8a.apk
