name: Production Build

on:
  push:
    branches: [ setup-between-project-11757872405521559736 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      # 🛠️ Step 1: Build using the ABSOLUTE path to your Termux-generated key
      - name: Build Signed APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.9 --distribution-type all
          chmod +x gradlew
          
          # We use $GITHUB_WORKSPACE to point to the exact physical location of the file
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/release.jks \
            -Pandroid.injected.signing.store.password=Snowhellom290 \
            -Pandroid.injected.signing.key.alias=between_production \
            -Pandroid.injected.signing.key.password=Snowhellom290

      - name: Organize APKs for Download
        run: |
          mkdir -p build/app/outputs/flutter-apk/
          find android/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} build/app/outputs/flutter-apk/ \;

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Between-Production-APK
          path: build/app/outputs/flutter-apk/*.apk
          
