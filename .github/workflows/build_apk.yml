name: Production Build

on:
  push:
    branches: [ setup-between-project-11757872405521559736 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ✅ Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      # ✅ Create key.properties dynamically from secrets
      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=release.jks" >> android/key.properties

      # ✅ Decode keystore file from base64 secret
      - name: Decode Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.jks

      # ✅ Flutter build (THIS is the main fix)
      - name: Build Release APK
        run: flutter build apk --release

      # ✅ Collect APK
      - name: Organize APKs for Download
        run: |
          mkdir -p build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/*.apk build/app/outputs/flutter-apk/ || true

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Between-Production-APK
          path: build/app/outputs/flutter-apk/*.apk
