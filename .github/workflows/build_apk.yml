name: Build Flutter APK

on:
  push:
    branches: [ setup-between-project-11757872405521559736 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create debug keystore
        run: |
          keytool -genkey -v -keystore android/app/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build with Gradle Directly
        run: |
          # This builds the APKs without using the buggy Flutter file-watcher
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Organize APKs for Upload
        run: |
          # Create the standard output directory
          mkdir -p build/app/outputs/flutter-apk/
          
          # Find and move the split APKs from the Android build folder to the Flutter build folder
          # This ensures the 'upload-artifact' step below can find them.
          cp android/app/build/outputs/apk/release/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/ || true
          cp android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/ || true
          
          # List files for debugging to be 100% sure
          ls -R build/app/outputs/

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload armeabi APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-armeabi
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
