name: Build Flutter APK

on:
  push:
    branches: [ setup-between-project-11757872405521559736 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create debug keystore
        run: |
          keytool -genkey -v -keystore android/app/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build with Gradle Directly
        run: |
          cd android
          # 1. Generate a fresh wrapper since the JAR is missing in the repo
          gradle wrapper --gradle-version 8.9 --distribution-type all
          
          # 2. Make it executable
          chmod +x gradlew
          
          # 3. Build the APKs (This handles SDK 36 via your gradle.properties)
          ./gradlew assembleRelease --no-daemon

      - name: Organize APKs for Upload
        run: |
          mkdir -p build/app/outputs/flutter-apk/
          
          # Use find to locate APKs regardless of which subfolder they landed in
          echo "Finding APKs..."
          find android/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} build/app/outputs/flutter-apk/ \;
          
          echo "Final check of output folder:"
          ls -R build/app/outputs/

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-arm64
          path: build/app/outputs/flutter-apk/*.apk

      - name: Upload armeabi APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-armeabi
          path: build/app/outputs/flutter-apk/*.apk
