name: Production Build

on:
  push:
    branches: [ setup-between-project-11757872405521559736 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      # 🛠️ HARDCODED FIX: Bypass GitHub Secrets to ensure keytool sees the full password
      - name: Create Permanent Keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "between_production" \
            -storepass "Snowhellom290" \
            -keypass "Snowhellom290" \
            -dname "CN=Between Dev, O=NoirSim, C=US"

      # 🛠️ HARDCODED SIGNING: Ensuring the APK is signed with the same credentials
      - name: Build Signed APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.9 --distribution-type all
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=release.jks \
            -Pandroid.injected.signing.store.password=Snowhellom290 \
            -Pandroid.injected.signing.key.alias=between_production \
            -Pandroid.injected.signing.key.password=Snowhellom290

      - name: Organize APKs
        run: |
          mkdir -p build/app/outputs/flutter-apk/
          find android/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} build/app/outputs/flutter-apk/ \;

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: Between-Production-Package
          path: |
            build/app/outputs/flutter-apk/*.apk
            android/app/release.jks
