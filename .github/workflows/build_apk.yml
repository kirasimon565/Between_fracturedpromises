name: Build Flutter APK

on:
  push:
    branches: [ setup-between-project-11757872405521559736 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create debug keystore
        run: |
          keytool -genkey -v -keystore android/app/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # We don't need to "force" Gradle 8.9 here because your 
      # gradle-wrapper.properties in the repo already says 8.9.
      # Flutter will download it automatically.

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-arm64
          # This is the standard path where Flutter puts it
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload armeabi APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-armeabi
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
