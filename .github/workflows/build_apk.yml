name: Production Build

on:
  push:
    branches: [ setup-between-project-11757872405521559736 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 🛠️ Ensures your custom icons are baked into the build
      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      # 🛠️ Creates your permanent digital signature
      - name: Create Permanent Keystore
        run: |
          keytool -genkey -v -keystore android/app/release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "${{ secrets.RELEASE_KEY_ALIAS }}" \
            -storepass "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.RELEASE_KEY_PASSWORD }}" \
            -dname "CN=Between Dev, O=NoirSim, C=US"

      - name: Build Signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cd android
          # Generate fresh wrapper for the runner
          gradle wrapper --gradle-version 8.9 --distribution-type all
          chmod +x gradlew
          
          # Build release while injecting the new signing info
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=release.jks \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Organize APKs for Upload
        run: |
          mkdir -p build/app/outputs/flutter-apk/
          find android/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} build/app/outputs/flutter-apk/ \;

      # 📦 UPLOADS BOTH THE APK AND THE KEYSTORE
      - name: Upload Production Package
        uses: actions/upload-artifact@v4
        with:
          name: Between-Production-Package
          path: |
            build/app/outputs/flutter-apk/*.apk
            android/app/release.jks
