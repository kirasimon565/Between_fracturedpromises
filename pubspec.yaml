name: between_fractured_promises
description: A Flutter + Firebase Live Episode System.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Reactivity
  get: ^4.6.6
  rxdart: ^0.27.7

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Audio
  audioplayers: ^6.1.0

  # Visuals, FX & Physics
  flutter_animate: ^4.5.0
  vector_math: ^2.1.4     
  path_drawing: ^1.0.1    
  flutter_shaders: ^0.1.3 
  flutter_svg: ^2.0.10    
  # 🛠️ FIX: Required for the Gallery Masonry Layout
  flutter_staggered_grid_view: ^0.7.0 

  # Utils
  shared_preferences: ^2.3.2
  google_fonts: ^6.1.0
  intl: ^0.19.0
  uuid: ^4.2.2
  cached_network_image: ^3.3.0
  path_provider: ^2.1.2   
  # 🛠️ FIX: Required for internal Firebase/Auth caching
  sqflite: ^2.3.0

  # JSON
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  # Asset Registry
  assets:
    - assets/logo/
    - assets/backgrounds/
    - assets/icons/
    - assets/badges/
    - assets/avatars/
    - assets/gallery/
    - assets/fx/
    - assets/music/

  # 🧪 Shader Registry (Required for flutter_shaders)
  shaders:
    - shaders/glitch.frag
    - shaders/bloom.frag
