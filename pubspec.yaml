name: between_fractured_promises
description: A Flutter + Firebase Live Episode System.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Reactivity
  get: ^4.6.6
  rxdart: ^0.27.7

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Visuals, FX & Physics
  flutter_animate: ^4.5.0
  vector_math: ^2.1.4     # Core math for the physics-based shatter
  path_drawing: ^1.0.1    # For the rope and branch shapes
  flutter_shaders: ^0.1.3 # REPLACED fragment_shader - for the Bloom and Glitch FX
  flutter_svg: ^2.0.10    # For high-quality Noir icons

  # Utils
  shared_preferences: ^2.3.2
  google_fonts: ^6.1.0
  intl: ^0.19.0
  uuid: ^4.2.2
  cached_network_image: ^3.3.0
  path_provider: ^2.1.2   # Required for shader and file management

  # JSON
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  # Ensure these assets exist in your project folders
  assets:
    - assets/logo/
    - assets/backgrounds/
    - assets/icons/
    - assets/badges/
    - assets/avatars/
    - assets/gallery/
    - assets/fx/
    - assets/music/
