name: between_fractured_promises
description: A Flutter + Firebase Live Episode System.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  get: ^4.6.6

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Utils
  shared_preferences: ^2.3.2
  google_fonts: ^6.1.0
  intl: ^0.19.0
  uuid: ^4.2.2
  flutter_animate: ^4.5.0

  # JSON
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/backgrounds/
    - assets/icons/
    - assets/badges/
    - assets/avatars/
    - assets/gallery/
    - assets/fx/
    - assets/music/
    - data/cache/
    - data/saves/
