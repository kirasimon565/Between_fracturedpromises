name: between_fractured_promises
description: "Between: Fractured Promises — an offline interactive psychological drama running on a custom story engine (DSL) inside a simulated phone OS."
publish_to: 'none'
version: 2.0.0+200

environment:
  # Riverpod 3.0.0 needs Dart >= 3.8.0; go_router 17 / drift 2.34 / sqlite3 3.5 /
  # google_fonts 8 / package_info_plus 10 / path_provider 2.1.6 need >= 3.10.0.
  sdk: ">=3.10.0 <4.0.0"

# No Firebase, no Firestore, no Storage, no Auth, no cloud sync, no
# SharedPreferences, no Hive, no Isar. Persistence is Drift/SQLite only and the
# game never opens a socket except to verify a store purchase.
dependencies:
  flutter:
    sdk: flutter

  # ── State management (runtime state only) ────────────────────────────────
  flutter_riverpod: ^3.0.0

  # ── Navigation ───────────────────────────────────────────────────────────
  go_router: ^18.0.0

  # ── Persistence (Drift / SQLite) ─────────────────────────────────────────
  drift: ^2.34.3
  # sqlite3_flutter_libs is end-of-life; SQLite 3.x (package:sqlite3) bundles its
  # native library automatically via Flutter asset hooks.
  sqlite3: ^3.5.2
  path_provider: ^2.1.6
  path: ^1.9.1

  # ── Audio ────────────────────────────────────────────────────────────────
  just_audio: ^0.10.6
  audio_session: ^0.2.4

  # ── Motion / visuals ─────────────────────────────────────────────────────
  flutter_animate: ^4.5.2
  google_fonts: ^8.2.1

  # ── Utilities ────────────────────────────────────────────────────────────
  intl: ^0.20.3

  # Used by the billing layer to detect which storefront installed the app
  # (Huawei AppGallery / Amazon Appstore / Samsung Galaxy Store).
  package_info_plus: ^10.2.1
  
# The engine, the Drift schema and every model are hand-written, so there is no
# build_runner step: `flutter pub get && flutter run` is the whole setup.

# ── icons ────────────────────────────────────────────────────────────
cupertino_icons: ^1.0.8

# for icons

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icons/launcher_icon.png"
  adaptive_icon_background: "#05060A"
  adaptive_icon_foreground: "assets/icons/launcher_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/backgrounds/
    - assets/icons/
    - assets/badges/
    - assets/avatars/
    - assets/gallery/
    - assets/fx/
    - assets/music/
    - assets/story/episodes/

  shaders:
    - shaders/glitch.frag
    - shaders/bloom.frag
