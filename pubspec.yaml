name: between_fractured_promises
description: A Flutter + Firebase Live Episode System.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Reactivity
  get: ^4.6.6
  rxdart: ^0.27.7

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Audio
  audioplayers: ^6.1.0

  # Visuals, FX & Physics
  flutter_animate: ^4.5.0
  vector_math: ^2.1.4     
  path_drawing: ^1.0.1    
  flutter_shaders: ^0.1.3 
  flutter_svg: ^2.0.10    
  flutter_staggered_grid_view: ^0.7.0 

  # Utils
  google_fonts: ^6.1.0
  intl: ^0.19.0
  uuid: ^4.2.2
  cached_network_image: ^3.3.0
  path_provider: ^2.1.2   
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1

  # JSON
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.8.0
  isar_generator: ^3.1.0+1
  # Tool to generate your custom launcher icons
  flutter_launcher_icons: ^0.14.4

# 🎨 CUSTOM LAUNCHER CONFIGURATION
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false # 🛠️ FIXED: Set to false to prevent iOS path errors
  image_path: "assets/icons/launcher_icon.png"
  # Adaptive icons ensure your icon looks perfect on modern Android
  adaptive_icon_background: "#000000" 
  adaptive_icon_foreground: "assets/icons/launcher_icon.png"

flutter:
  uses-material-design: true

  # Asset Registry
  assets:
    - assets/logo/
    - assets/backgrounds/
    - assets/icons/
    - assets/badges/
    - assets/avatars/
    - assets/gallery/
    - assets/fx/
    - assets/music/

  # 🧪 Shader Registry
  shaders:
    - shaders/glitch.frag
    - shaders/bloom.frag
