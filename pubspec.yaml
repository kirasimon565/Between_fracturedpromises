name: between_fractured_promises
description: "Between: Fractured Promises — an offline interactive psychological drama running on a custom story engine (DSL) inside a simulated phone OS."
publish_to: 'none'
version: 2.0.0+200

environment:
  sdk: ">=3.4.0 <4.0.0"

# No Firebase, no Firestore, no Storage, no Auth, no cloud sync, no
# SharedPreferences, no Hive, no Isar. Persistence is Drift/SQLite only and the
# game never opens a socket except to verify a store purchase.
dependencies:
  flutter:
    sdk: flutter

  # ── State management (runtime state only) ────────────────────────────────
  flutter_riverpod: ^2.5.1

  # ── Navigation ───────────────────────────────────────────────────────────
  go_router: ^14.2.0

  # ── Persistence (Drift / SQLite) ─────────────────────────────────────────
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0

  # ── Audio ────────────────────────────────────────────────────────────────
  just_audio: ^0.9.38
  audio_session: ^0.1.19

  # ── Motion / visuals ─────────────────────────────────────────────────────
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1

  # ── Utilities ────────────────────────────────────────────────────────────
  intl: ^0.19.0

  # Used by the billing layer to detect which storefront installed the app
  # (Huawei AppGallery / Amazon Appstore / Samsung Galaxy Store).
  package_info_plus: ^8.0.0

# The engine, the Drift schema and every model are hand-written, so there is no
# build_runner step: `flutter pub get && flutter run` is the whole setup.
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icons/launcher_icon.png"
  adaptive_icon_background: "#05060A"
  adaptive_icon_foreground: "assets/icons/launcher_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/backgrounds/
    - assets/icons/
    - assets/badges/
    - assets/avatars/
    - assets/gallery/
    - assets/fx/
    - assets/music/
    - assets/story/episodes/
    - assets/data/

  shaders:
    - shaders/glitch.frag
    - shaders/bloom.frag
